id: dre_to_parquet
namespace: continental.finance
description: Pipeline para extração de DRE Detalhado e Faturamento da Loja diretamente para o Supabase PostgreSQL

tasks:
  - id: extract_and_convert
    type: io.kestra.plugin.scripts.python.Script
    containerImage: ghcr.io/kestra-io/pydata:latest
    beforeCommands:
      - echo "Iniciando ambiente Python..."
    env:
      DRE_API_KEY: "{{ kv('DRE_API_KEY') }}"
      DRE_CLIENT_ID: "{{ kv('DRE_CLIENT_ID') }}"
      DRE_CLIENT_SECRET: "{{ kv('DRE_CLIENT_SECRET') }}"
      SUPABASE_URL: "{{ kv('SUPABASE_URL') }}"
      SUPABASE_API_KEY: "{{ kv('SUPABASE_API_KEY') }}"
    script: |
      import sys
      import subprocess
      import urllib.request

      # --- CONFIGURAÇÃO DO REPOSITÓRIO GITHUB ---
      GITHUB_REPO_URL = "https://raw.githubusercontent.com/scoretecnologia/grupo-r3-api/main"
      SCRIPT_NAME = "dre_to_parquet.py"
      REQS_NAME = "requirements.txt"

      def download_file(filename):
          url = f"{GITHUB_REPO_URL}/{filename}"
          print(f"Baixando {filename} de: {url}")
          try:
              urllib.request.urlretrieve(url, filename)
              print(f"✅ {filename} baixado com sucesso!")
          except Exception as e:
              print(f"❌ Erro ao baixar {filename}: {e}")
              sys.exit(1)

      # Baixa os arquivos necessários do repositório
      download_file(REQS_NAME)
      download_file(SCRIPT_NAME)

      # Instala dependências
      print("Instalando dependências...")
      subprocess.check_call([sys.executable, "-m", "pip", "install", "-r", REQS_NAME])
      
      # Executa o script principal
      print(f"Iniciando execução do {SCRIPT_NAME}...")
      subprocess.check_call([sys.executable, SCRIPT_NAME])

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *" # Roda todos os dias às 02:00 da manhã
